name: voice_assistant
description: "Voice Assistant Flutter project with BLE Control, Wi-Fi WebSocket PCM Audio Streaming, and Offline Vosk Speech Recognition Engine (English + Banglish)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.0
  vosk_flutter: ^0.3.2
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  path_provider_android: 2.2.23

dependency_overrides:
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
